name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the exact toolchain pinned in mise.toml, so CI matches local development.
      - uses: jdx/mise-action@v4
      - run: mise run sync
      - name: terraform validate
        run: |
          for env in local aws; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
      - run: mise run lint
      - name: terraform security scan
        run: mise run scan
      - name: databricks bundle schema check
        run: mise run bundle-check
      - run: mise run test

  integration:
    name: integration (Postgres + Floci)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run sync
      - run: mise run up
      - run: mise run tf-local
      - run: mise run migrate
      - run: mise run seed
      # Registers every seeded object deterministically instead of racing the async Lambda.
      - run: mise run backfill
      - name: build images
        run: docker compose --profile ingest --profile app build spark api
      - run: mise run test-integration
      # Retrieval-only: deterministic and free. The full-pipeline gate needs a real provider.
      - name: retrieval eval gate
        run: mise run eval -- --no-mlflow
      - name: eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: data/eval/report.json
          if-no-files-found: ignore
      - name: container logs
        if: failure()
        run: docker compose --profile core logs --no-color --tail 200
      - name: stop stack
        if: always()
        run: mise run down

  publish:
    name: publish images
    # Only after both gates pass, and only for main: a pull request must never be able to
    # overwrite a tag that a deployment might pull. Packages inherit the repository's
    # visibility, so these images are private while the repository is.
    needs: [checks, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, spark]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token is scoped to this repository, so no registry credential is stored.
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `sha-<commit>` is what a deployment pins; `main` is the moving convenience tag.
          tags: |
            type=sha,format=long
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
